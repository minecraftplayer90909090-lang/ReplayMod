name: Build ReplayMod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ReplayMod/ReplayMod
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: |
            8
            16
            17
            21
          distribution: 'temurin'
      - name: Apply fixes
        run: |
          python3 - << 'EOF'
          with open("src/main/java/com/replaymod/replay/camera/CameraEntity.java", "r") as f:
              content = f.read()
          content = content.replace("return canSpectate(mc.targetedEntity);", "return true;")
          content = content.replace("private Boolean shouldRenderHotbar() {\n            return false;", "private Boolean shouldRenderHotbar() {\n            return true;")
          with open("src/main/java/com/replaymod/replay/camera/CameraEntity.java", "w") as f:
              f.write(content)
          print("Done!")
          EOF
      - name: Verify fixes
        run: |
          grep -n "shouldRenderHotbar\|shouldRenderSpectatorCrosshair" src/main/java/com/replaymod/replay/camera/CameraEntity.java
      - name: Build 1.21
        run: ./gradlew :1.21:build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: replaymod-1.21
          path: versions/1.21/build/libs/*.jar
